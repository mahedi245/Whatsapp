services:
  - type: web
    name: whatsapp-bulk-saas
    env: node
    plan: free
    buildCommand: node -e "const fs=require('fs'); fs.copyFileSync('prisma/schema.postgres.prisma', 'prisma/schema.prisma')" && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-db
          property: connectionString

databases:
  - name: whatsapp-db
    plan: free
